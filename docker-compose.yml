services:
  postgres:
    image: postgres:16-alpine
    container_name: menufit-local-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: menufit
      POSTGRES_PASSWORD: menufit
      POSTGRES_DB: menufit
    volumes:
      - menufit_local_pg:/var/lib/postgresql/data

volumes:
  menufit_local_pg:
